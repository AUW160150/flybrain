<svg xmlns="http://www.w3.org/2000/svg" class="rf rf-exp1-why-stopped" viewBox="0 0 330 350" width="330" height="350" role="img" aria-labelledby="exp1-why-stopped-sm-t exp1-why-stopped-sm-d"><title id="exp1-why-stopped-sm-t">The planned next test&#x27;s finest measurement against the whole gap it would have searched</title><desc id="exp1-why-stopped-sm-d">A ruler from 0 to 3 points of the main score. The circuit&#x27;s whole lead over the direct connection with the target hidden was 0.70 points. The planned next test could reliably detect only differences of 2.0 points or more in the most favourable case, 2.8 points in a less favourable one.</desc><style>
