<svg xmlns="http://www.w3.org/2000/svg" class="rf rf-exp1-memory-dissociation" viewBox="0 0 330 770" width="330" height="770" role="img" aria-labelledby="exp1-memory-dissociation-sm-t exp1-memory-dissociation-sm-d"><title id="exp1-memory-dissociation-sm-t">Collisions: the fly circuit against the direct connection, with the target visible and hidden</title><desc id="exp1-memory-dissociation-sm-d">Two panels, posts and walls. In each, the share of evaluation episodes with a collision for the fly circuit and for the memoryless direct connection, with the target always visible and with the target hidden. Wall collisions: the circuit is worse by about the same amount in both conditions. Post collisions: identical when visible, the circuit better when hidden.</desc><style>
