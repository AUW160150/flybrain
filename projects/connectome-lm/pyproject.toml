[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-connectome-lm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch==2.14.0", "numpy==2.5.3", "scipy==1.18.1", "pyarrow==25.0.1", "networkx==3.7", "matplotlib==3.11.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
fly-lm = "fly_connectome_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
