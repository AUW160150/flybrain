   <text style="font-weight: 500; font-size: 10px; font-family: 'Avenir Next', 'DejaVu Sans'; text-anchor: start; fill: #627786" x="54" y="29.376" transform="rotate(-0 54 29.376)">MALECNS / LANGUAGE EXPERIMENT                                      06   •   CONFIRMATION</text>
  </g>
  <g id="text_32">
   <text style="font-weight: 700; font-size: 28px; font-family: 'Avenir Next', 'DejaVu Sans'; text-anchor: start; fill: #1e3443" x="54" y="69.156" transform="rotate(-0 54 69.156)">The models use their recurrent memory</text>
  </g>
  <g id="text_33">
   <text style="font-size: 12px; font-family: 'Avenir Next', 'DejaVu Sans'; text-anchor: start; fill: #627786" x="54" y="97.308" transform="rotate(-0 54 97.308)">Predeclared interventions on trained models • validation only • larger increases mean more damage to prediction.</text>
  </g>
  <g id="text_34">
   <text style="font-size: 9.5px; font-family: 'Avenir Next', 'DejaVu Sans'; fill: #627786" transform="translate(54 561.943052)">Values are intervention BPB minus the unmodified model’s validation BPB, averaged over all runs in that condition. Test scores and saved checkpoints are unchanged.</text>
   <text style="font-size: 9.5px; font-family: 'Avenir Next', 'DejaVu Sans'; fill: #627786" transform="translate(54 582.706252)">Interventions differ by architecture. Parameter damage demonstrates dependence on recurrence; it does not establish a benefit from the fly’s particular wiring.</text>
  </g>
