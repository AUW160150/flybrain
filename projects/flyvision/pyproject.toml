[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyvision"
version = "0.1.0"
description = "Evidence-traceable sensory mapping of the local MaleCNS connectome"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=15", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
optics = ["rdata>=1.1", "pygame-ce>=2.5"]

[project.scripts]
flyvision = "flyvision.__main__:main"

[tool.setuptools]
packages = ["flyvision"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
