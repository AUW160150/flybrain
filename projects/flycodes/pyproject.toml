[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flycodes"
version = "0.1.0"
description = "Measured code generation through a frozen MaleCNS connectome"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14", "pyarrow>=18", "torch>=2.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
flycodes = "flycodes.cli:main"

[tool.setuptools.packages.find]
include = ["flycodes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
