[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "connectome-viz"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "pyarrow==25.0.1", "torch==2.14.0", "pillow>=11"]
[project.scripts]
connectome-viz = "connectome_viz.cli:main"
[tool.setuptools.package-data]
connectome_viz = ["web/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
