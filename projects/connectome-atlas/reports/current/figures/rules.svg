ical ID plus first seven distinct incoming/outgoing partners in biological-ID order.</text><text x="25" y="392" font-size="13" fill="#173b46" text-anchor="start">The reference nodes mean layer activations, position/channel activations, and token vectors respectively. They are not anatomical units.</text></g></svg>