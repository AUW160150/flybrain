<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Explicit untrained reference architectures</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#173b46"><text x="25" y="36" font-size="22" fill="#173b46" text-anchor="start">ARCHITECTURE REFERENCES / untrained, no quality comparison</text><text x="25" y="64" font-size="13" fill="#173b46" text-anchor="start">MLP and CNN: visualization-only educational modules. Transformer: repository module and parameter-counting configuration.</text><text x="25" y="100" font-size="17" fill="#173b46" text-anchor="start">WINDOW MLP · 33,152 unique active parameters</text><rect x="25" y="120" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="127.5" y="147" font-size="16" fill="#316fa8" text-anchor="middle">8 causal bytes</text><text x="127.5" y="170" font-size="12" fill="#173b46" text-anchor="middle">E [256,16]</text><text x="127.5" y="189" font-size="12" fill="#173b46" text-anchor="middle">zero embedding padding</text><path d="M230 165 L260 165" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="120" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="362.5" y="147" font-size="16" fill="#316fa8" text-anchor="middle">Flatten 8 × 16</text><text x="362.5" y="170" font-size="12" fill="#173b46" text-anchor="middle">128 activations</text><text x="362.5" y="189" font-size="12" fill="#173b46" text-anchor="middle">finite supplied context</text><path d="M465 165 L495 165" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="120" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="597.5" y="147" font-size="16" fill="#316fa8" text-anchor="middle">Dense 128 → 64</text><text x="597.5" y="170" font-size="12" fill="#173b46" text-anchor="middle">+ bias · ReLU</text><path d="M700 165 L730 165" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="120" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="832.5" y="147" font-size="16" fill="#316fa8" text-anchor="middle">Dense 64 → 64</text><text x="832.5" y="170" font-size="12" fill="#173b46" text-anchor="middle">+ bias · ReLU</text><path d="M935 165 L965 165" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="965" y="120" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="1067.5" y="147" font-size="16" fill="#316fa8" text-anchor="middle">Dense 64 → 256</text><text x="1067.5" y="170" font-size="12" fill="#173b46" text-anchor="middle">+ bias</text><text x="1067.5" y="189" font-size="12" fill="#173b46" text-anchor="middle">next-byte logits</text><text x="25" y="239" font-size="12" fill="#173b46" text-anchor="start">No recurrence. Every dense input activation connects to every output in the next layer; omitted drawing edges are not sparsity.</text><text x="25" y="280" font-size="17" fill="#173b46" text-anchor="start">CAUSAL 1D CNN · 17,216 unique active parameters</text><rect x="25" y="300" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="127.5" y="327" font-size="16" fill="#316fa8" text-anchor="middle">Byte sequence</text><text x="127.5" y="350" font-size="12" fill="#173b46" text-anchor="middle">Embedding [256,16]</text><path d="M230 345 L260 345" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="300" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="362.5" y="327" font-size="16" fill="#316fa8" text-anchor="middle">Conv1d 16 → 32</text><text x="362.5" y="350" font-size="12" fill="#173b46" text-anchor="middle">k=3, dilation=1</text><text x="362.5" y="369" font-size="12" fill="#173b46" text-anchor="middle">left pad=2 · ReLU</text><path d="M465 345 L495 345" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="300" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="597.5" y="327" font-size="16" fill="#316fa8" text-anchor="middle">Conv1d 32 → 32</text><text x="597.5" y="350" font-size="12" fill="#173b46" text-anchor="middle">k=3, dilation=2</text><text x="597.5" y="369" font-size="12" fill="#173b46" text-anchor="middle">left pad=4 · ReLU</text><path d="M700 345 L730 345" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="300" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="832.5" y="327" font-size="16" fill="#316fa8" text-anchor="middle">32 channels / position</text><text x="832.5" y="350" font-size="12" fill="#173b46" text-anchor="middle">stride=1 · shared kernels</text><text x="832.5" y="369" font-size="12" fill="#173b46" text-anchor="middle">receptive field=7</text><path d="M935 345 L965 345" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="965" y="300" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="1067.5" y="327" font-size="16" fill="#316fa8" text-anchor="middle">Dense 32 → 256</text><text x="1067.5" y="350" font-size="12" fill="#173b46" text-anchor="middle">per position + bias</text><text x="25" y="419" font-size="12" fill="#173b46" text-anchor="start">Kernel coefficients are reused across positions. Feature locations are artificial activations, not biological neurons.</text><text x="25" y="460" font-size="17" fill="#173b46" text-anchor="start">DECODER-ONLY TRANSFORMER · 52,924 unique active parameters</text><rect x="25" y="480" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="127.5" y="507" font-size="16" fill="#316fa8" text-anchor="middle">Byte + position</text><text x="127.5" y="530" font-size="12" fill="#173b46" text-anchor="middle">d=32 · context=128</text><text x="127.5" y="549" font-size="12" fill="#173b46" text-anchor="middle">learned absolute position</text><path d="M230 525 L260 525" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="480" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="362.5" y="507" font-size="16" fill="#316fa8" text-anchor="middle">Masked self-attention</text><text x="362.5" y="530" font-size="12" fill="#173b46" text-anchor="middle">Q/K/V + output projection</text><text x="362.5" y="549" font-size="12" fill="#173b46" text-anchor="middle">4 heads · j ≤ t</text><path d="M465 525 L495 525" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="480" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="597.5" y="507" font-size="16" fill="#316fa8" text-anchor="middle">Residual + LayerNorm</text><text x="597.5" y="530" font-size="12" fill="#173b46" text-anchor="middle">post-normalization</text><text x="597.5" y="549" font-size="12" fill="#173b46" text-anchor="middle">no future positions</text><path d="M700 525 L730 525" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="480" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="832.5" y="507" font-size="16" fill="#316fa8" text-anchor="middle">FFN + residual + LN</text><text x="832.5" y="530" font-size="12" fill="#173b46" text-anchor="middle">32 → 412 → 32</text><text x="832.5" y="549" font-size="12" fill="#173b46" text-anchor="middle">ReLU · 1 block</text><path d="M935 525 L965 525" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="965" y="480" width="205" height="92" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="1067.5" y="507" font-size="16" fill="#316fa8" text-anchor="middle">Readout 32 → 32</text><text x="1067.5" y="530" font-size="12" fill="#173b46" text-anchor="middle">then 32 → 256 + bias</text><text x="1067.5" y="549" font-size="12" fill="#173b46" text-anchor="middle">next-byte logits</text><text x="25" y="660" font-size="12" fill="#173b46" text-anchor="start">Causal mask is fixed. Attention coefficients depend on input; no attention heatmap is fabricated.</text><path d="M 245 525 L 245 608 L 595 608 L 595 572" fill="none" stroke="#c86035" stroke-dasharray="5 3" stroke-width="2" marker-end="url(#arrow)"/><path d="M 715 525 L 715 632 L 910 632 L 910 572" fill="none" stroke="#c86035" stroke-dasharray="5 3" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="629" font-size="12" fill="#c86035" text-anchor="start">Residual input x + attention(x)</text><text x="720" y="650" font-size="12" fill="#c86035" text-anchor="start">Residual y + FFN(y)</text></g></svg>