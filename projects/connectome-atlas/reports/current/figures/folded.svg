<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="395" viewBox="0 0 1200 395" role="img"><title>Actual implemented graph-constrained byte predictor</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#173b46"><text x="26" y="35" font-size="22" fill="#173b46" text-anchor="start">ACTUAL PREDICTOR / complete computational interfaces</text><text x="26" y="61" font-size="13" fill="#173b46" text-anchor="start">Source archive verified against run code hash. Scalar state units correspond to biological IDs only for wiring bookkeeping.</text><rect x="25" y="130" width="145" height="112" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="97.5" y="157" font-size="16" fill="#316fa8" text-anchor="middle">Byte embedding</text><text x="97.5" y="180" font-size="12" fill="#173b46" text-anchor="middle">byte t → e[t] in R^32</text><text x="97.5" y="199" font-size="12" fill="#173b46" text-anchor="middle">E [256,32] · 8,192</text><path d="M170 185 L220 185" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="130" width="180" height="112" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="310.0" y="157" font-size="16" fill="#316fa8" text-anchor="middle">Dense input B</text><text x="310.0" y="180" font-size="12" fill="#173b46" text-anchor="middle">B [512,32]</text><text x="310.0" y="199" font-size="12" fill="#173b46" text-anchor="middle">16,384 coefficients</text><text x="310.0" y="218" font-size="12" fill="#173b46" text-anchor="middle">All 512 states receive input</text><path d="M400 185 L460 185" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y="130" width="260" height="112" rx="9" fill="#f0f7f5" stroke="#147c72"/><text x="590.0" y="157" font-size="16" fill="#147c72" text-anchor="middle">Recurrent update</text><text x="590.0" y="180" font-size="12" fill="#173b46" text-anchor="middle">W[target,source] · 3,061 θ</text><text x="590.0" y="199" font-size="12" fill="#173b46" text-anchor="middle">bias b [512] · tanh</text><text x="590.0" y="218" font-size="12" fill="#173b46" text-anchor="middle">512 scalar artificial states</text><path d="M720 185 L780 185" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="130" width="145" height="112" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="852.5" y="157" font-size="16" fill="#316fa8" text-anchor="middle">Dense readout R</text><text x="852.5" y="180" font-size="12" fill="#173b46" text-anchor="middle">R [32,512]</text><text x="852.5" y="199" font-size="12" fill="#173b46" text-anchor="middle">16,384 coefficients</text><path d="M925 185 L985 185" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="985" y="130" width="180" height="112" rx="9" fill="#f0f7f5" stroke="#316fa8"/><text x="1075.0" y="157" font-size="16" fill="#316fa8" text-anchor="middle">Output O + c</text><text x="1075.0" y="180" font-size="12" fill="#173b46" text-anchor="middle">O [256,32] + c [256]</text><text x="1075.0" y="199" font-size="12" fill="#173b46" text-anchor="middle">8,192 + 256</text><text x="1075.0" y="218" font-size="12" fill="#173b46" text-anchor="middle">256 next-byte logits</text><path d="M 570 130 L 570 92 L 698 92 L 698 130" fill="none" stroke="#147c72" stroke-width="2" marker-end="url(#arrow)"/><text x="634" y="82" font-size="12" fill="#147c72" text-anchor="middle">W h[t-1] : reused learned recurrence</text><path d="M 590 242 L 590 276 L 695 276 L 695 242" fill="none" stroke="#c86035" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow)"/><text x="710" y="279" font-size="13" fill="#c86035" text-anchor="start">Engineered 0.5 h[t-1] retention</text><text x="25" y="315" font-size="18" fill="#173b46" text-anchor="start">h[t] = 0.5 h[t-1] + 0.5 tanh(W h[t-1] + B E[byte[t]] + b)     logits[t] = O R h[t] + c</text><text x="25" y="345" font-size="14" fill="#173b46" text-anchor="start">52,981 active parameters · 49,408 dense interface parameters + 512 recurrent biases + 3,061 recurrent edge scalars</text><text x="25" y="373" font-size="12" fill="#173b46" text-anchor="start">Teal: learned graph core • Blue: engineered dense interfaces • Dashed orange: engineered retention, not an anatomical autapse</text></g></svg>