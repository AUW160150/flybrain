<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img"><title>Actual recurrent predictor unrolled for three byte steps</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#173b46"><text x="25" y="35" font-size="22" fill="#173b46" text-anchor="start">THREE BYTE STEPS / same units, shared parameters</text><text x="25" y="63" font-size="14" fill="#173b46" text-anchor="start">Synchronous update: sources at the previous step affect receivers at the next. No future-byte input.</text><rect x="165" y="145" width="245" height="95" rx="9" fill="#f0f7f5" stroke="#147c72"/><text x="287.5" y="172" font-size="16" fill="#147c72" text-anchor="middle">State h at t + 0</text><text x="287.5" y="195" font-size="12" fill="#173b46" text-anchor="middle">512 scalar states · W restricted to 3061 pairs</text><text x="287.5" y="214" font-size="12" fill="#173b46" text-anchor="middle">0.5 previous + 0.5 tanh(proposal)</text><text x="287" y="99" font-size="14" fill="#316fa8" text-anchor="middle">byte at t + 0 → E → dense B</text><path d="M287 106 L287 145" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><path d="M287 240 L287 285" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><text x="287" y="310" font-size="14" fill="#316fa8" text-anchor="middle">R → O+c → predict byte t + 1</text><text x="20" y="180" font-size="14" fill="#173b46" text-anchor="start">zero state</text><path d="M20 200 L165 200" fill="none" stroke="#147c72" stroke-width="2" marker-end="url(#arrow)"/><rect x="515" y="145" width="245" height="95" rx="9" fill="#f0f7f5" stroke="#147c72"/><text x="637.5" y="172" font-size="16" fill="#147c72" text-anchor="middle">State h at t + 1</text><text x="637.5" y="195" font-size="12" fill="#173b46" text-anchor="middle">512 scalar states · W restricted to 3061 pairs</text><text x="637.5" y="214" font-size="12" fill="#173b46" text-anchor="middle">0.5 previous + 0.5 tanh(proposal)</text><text x="637" y="99" font-size="14" fill="#316fa8" text-anchor="middle">byte at t + 1 → E → dense B</text><path d="M637 106 L637 145" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><path d="M637 240 L637 285" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><text x="637" y="310" font-size="14" fill="#316fa8" text-anchor="middle">R → O+c → predict byte t + 2</text><path d="M410 175 L515 175" fill="none" stroke="#147c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 219 L515 219" fill="none" stroke="#c86035" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 3"/><rect x="865" y="145" width="245" height="95" rx="9" fill="#f0f7f5" stroke="#147c72"/><text x="987.5" y="172" font-size="16" fill="#147c72" text-anchor="middle">State h at t + 2</text><text x="987.5" y="195" font-size="12" fill="#173b46" text-anchor="middle">512 scalar states · W restricted to 3061 pairs</text><text x="987.5" y="214" font-size="12" fill="#173b46" text-anchor="middle">0.5 previous + 0.5 tanh(proposal)</text><text x="987" y="99" font-size="14" fill="#316fa8" text-anchor="middle">byte at t + 2 → E → dense B</text><path d="M987 106 L987 145" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><path d="M987 240 L987 285" fill="none" stroke="#316fa8" stroke-width="2" marker-end="url(#arrow)"/><text x="987" y="310" font-size="14" fill="#316fa8" text-anchor="middle">R → O+c → predict byte t + 3</text><path d="M760 175 L865 175" fill="none" stroke="#147c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 219 L865 219" fill="none" stroke="#c86035" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 3"/><text x="25" y="355" font-size="15" fill="#173b46" text-anchor="start">Every step reuses E, B, W, b, R, O, c. Unrolling does not add neurons, anatomical layers, or parameters.</text><text x="25" y="382" font-size="13" fill="#173b46" text-anchor="start">Solid teal: W h(previous). Dashed orange: same-node identity retention. One update per byte is not a biological duration.</text></g></svg>